default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "default"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    # Deadlines must not wait behind long-running work in the default pool.
    - queues: "timeouts"
      threads: 1
      processes: 1
      polling_interval: 0.1
  schedulers:
    - recurring_schedule_file: config/recurring.yml
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
