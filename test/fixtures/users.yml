# Match has_secure_password in the test environment: the minimum cost keeps
# each sign-in at about a millisecond instead of a quarter second.
<% password_digest = BCrypt::Password.create("password123", cost: BCrypt::Engine::MIN_COST) %>

regular_user:
  name: Regular User
  email_address: regular@example.com
  password_digest: <%= password_digest %>
  password_updated_at: <%= 1.week.ago %>
  state: active

