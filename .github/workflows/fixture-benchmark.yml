name: Fixture benchmark

on: pull_request

permissions:
  contents: read

jobs:
  benchmark:
    if: github.head_ref == 'refactor/shared-test-helpers-1616'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          --tmpfs=/var/lib/postgresql

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
      COVERAGE: "1"
      BASELINE_SHA: d72e16d52e42d6cb06eec125e921c2f07d56cb6b
      FIXTURE_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: Compare three full suite runs per version
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import statistics
          import subprocess
          import time

          results = []
          for index, version in enumerate(["before", "after", "after", "before", "before", "after"], 1):
              revision = os.environ["BASELINE_SHA" if version == "before" else "FIXTURE_SHA"]
              subprocess.run(["git", "restore", "--source=" + revision, "--", "test"], check=True)
              log = Path(f"fixture-benchmark-{index}-{version}.log")
              started = time.perf_counter()
              with log.open("w") as output:
                  run = subprocess.run(["bin/rails", "test", "--seed", "1616"],
                                       stdout=output, stderr=subprocess.STDOUT)
              wall = time.perf_counter() - started
              output = log.read_text()
              summary = re.search(r"(\d+) runs, (\d+) assertions, (\d+) failures, (\d+) errors, (\d+) skips", output)
              timing = re.search(r"Finished in ([\d.]+)s", output)
              if run.returncode or not summary or not timing:
                  print(output, flush=True)
                  raise SystemExit(run.returncode or 1)
              row = {"version": version, "revision": revision,
                     "suite_seconds": float(timing[1]), "wall_seconds": round(wall, 3),
                     "summary": summary[0]}
              results.append(row)
              print(json.dumps(row), flush=True)
              Path("fixture-benchmark.json").write_text(json.dumps(results, indent=2))
          for version in ["before", "after"]:
              rows = [row for row in results if row["version"] == version]
              print(version, "median suite seconds:", statistics.median(row["suite_seconds"] for row in rows),
                    "median wall seconds:", statistics.median(row["wall_seconds"] for row in rows), flush=True)
          PY

      - name: Upload measurements and test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fixture-benchmark
          path: |
            fixture-benchmark*.log
            fixture-benchmark.json
