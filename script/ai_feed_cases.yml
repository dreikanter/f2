qualifying:
  prompt: Find one recent official Ruby release announcement. Summarize it with its source link and publication date when available.
  items:
    - {body: "Ruby is an open-source programming language.", source_url: "https://www.ruby-lang.org/en/about/", published_at: "2026-09-27T13:36:54Z"}
  expected_usable: 1
empty:
  prompt: Find an official Ruby release announcement published on 2099-01-01. Return no items if none is supported by available evidence.
  items: []
  expected_usable: 0
rejected:
  prompt: Find one substantive article about programming and summarize it with its source link.
  items:
    - {body: "", source_url: "https://www.ruby-lang.org/en/about/"}
  expected_usable: 0
  expected_rejected: 1
seeded:
  prompt: Summarize https://www.ruby-lang.org/en/about/ with its source link.
  imported_urls: ["https://www.ruby-lang.org/en/about/"]
  items:
    - {body: "Ruby is an open-source programming language.", source_url: "https://www.ruby-lang.org/en/about/"}
  expected_usable: 0
  expected_filtered: 1
missing_date:
  prompt: Summarize https://www.ruby-lang.org/en/about/. Leave the publication date empty if the page does not provide one.
  items:
    - {body: "Synthetic source with no publication date", source_url: "https://www.ruby-lang.org/en/about/"}
  expected_usable: 1
  expected_published_at: "2026-09-27T18:00:00Z"
mixed_sources:
  prompt: Compare Ruby and Python briefly using their official documentation. Cite both sources in one post.
  items:
    - {body: "Ruby and Python are dynamic languages. Sources: https://www.ruby-lang.org/en/about/ and https://docs.python.org/3/tutorial/", source_url: null}
  expected_usable: 1
  expected_content: "https://docs.python.org/3/tutorial/"
generation:
  prompt: Invent a short story about an astronomer. No research is needed.
  search_calls: 0
  items:
    - {body: "The last star blinked, and the astronomer waved back.", source_url: null}
  expected_usable: 1
  expected_content: "The last star blinked, and the astronomer waved back."
transformation:
  prompt: "Translate this supplied text into French: Hello, world!"
  search_calls: 0
  items:
    - {body: "Bonjour, monde !", source_url: null}
  expected_usable: 1
  expected_content: "Bonjour, monde !"
